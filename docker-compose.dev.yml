x-django-env: &django-env
  POSTGRES_HOST: gabevent-db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: gabevent
  POSTGRES_USER: gabevent
  POSTGRES_PASSWORD: devpassword123
  REDIS_URL: redis://gabevent-redis:6379/0
  CELERY_BROKER_URL: redis://gabevent-redis:6379/0
  CELERY_RESULT_BACKEND: redis://gabevent-redis:6379/0
  DJANGO_SETTINGS_MODULE: config.settings
  DEBUG: "1"
  SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
  ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,gabevent-web
  CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}

services:
  gabevent-db:
    container_name: gabevent-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gabevent
      POSTGRES_USER: gabevent
      POSTGRES_PASSWORD: devpassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gabevent -d gabevent"]
      interval: 5s
      timeout: 5s
      retries: 10

  gabevent-redis:
    container_name: gabevent-redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gabevent-web:
    container_name: gabevent-web
    build: .
    restart: unless-stopped
    user: "0:0"
    env_file:
      - .env
    environment:
      <<: *django-env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      gabevent-db:
        condition: service_healthy
      gabevent-redis:
        condition: service_healthy

  gabevent-celery-worker:
    container_name: gabevent-celery-worker
    build: .
    restart: unless-stopped
    user: "0:0"
    env_file:
      - .env
    environment:
      <<: *django-env
    command: celery -A config worker -l info
    volumes:
      - .:/app
    depends_on:
      gabevent-db:
        condition: service_healthy
      gabevent-redis:
        condition: service_healthy

  gabevent-celery-beat:
    container_name: gabevent-celery-beat
    build: .
    restart: unless-stopped
    user: "0:0"
    env_file:
      - .env
    environment:
      <<: *django-env
    command: celery -A config beat -l info
    volumes:
      - .:/app
    depends_on:
      gabevent-db:
        condition: service_healthy
      gabevent-redis:
        condition: service_healthy

volumes:
  postgres_dev_data:
