{% comment %}Admin top bar — Zanalyze-inspired soft shell{% endcomment %}
<header class="admin-topbar">
  <div class="admin-brand">
    <span class="admin-dot" aria-hidden="true"></span>
    <div>
      <p class="admin-kicker">{{ admin_kicker|default:"Administration" }}</p>
      <h1 class="admin-title">{{ admin_title }}</h1>
    </div>
  </div>
  <nav class="admin-nav" aria-label="Navigation admin">
    <a href="{% url 'dashboard' %}" class="{% if nav_active == 'dash' %}is-active{% endif %}">Tableau</a>
    <a href="{% url 'home' %}?scan=1">Scanner</a>
    <a href="{% url 'search' %}" class="{% if nav_active == 'search' %}is-active{% endif %}">Recherche</a>
    <a href="{% url 'import_excel' %}" class="{% if nav_active == 'import' %}is-active{% endif %}">Import</a>
    <a href="{% url 'export_report' %}">Export</a>
    <a href="{% url 'home' %}">Accueil</a>
    <form method="post" action="{% url 'logout' %}" class="inline-form">
      {% csrf_token %}
      <button type="submit" class="admin-logout">Déconnexion</button>
    </form>
  </nav>
</header>
