<div class="ge-sheet-backdrop" hidden></div>

<div class="ge-bottom-sheet ge-legal-sheet" id="ge-sheet-faq" role="dialog" aria-modal="true" aria-labelledby="ge-sheet-faq-title" hidden data-ge-expand>
  <div class="ge-sheet-handle" aria-hidden="true"></div>
  <header class="ge-sheet-head">
    <div>
      <p class="ge-auth-kicker">Aide</p>
      <h2 id="ge-sheet-faq-title">FAQ</h2>
    </div>
    <button type="button" class="ge-sheet-x" data-sheet-close aria-label="Fermer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="ge-sheet-scroll">
    {% if faq_sections %}
    {% for section, items in faq_sections %}
    <section class="ge-faq-section">
      <h3>{{ section }}</h3>
      <div class="ge-faq-list">
        {% for item in items %}
        <details class="ge-faq-item">
          <summary>
            <span>{{ item.question }}</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </summary>
          <p>{{ item.answer }}</p>
        </details>
        {% endfor %}
      </div>
    </section>
    {% endfor %}
    {% else %}
    <p class="ge-muted">La FAQ sera bientôt disponible.</p>
    {% endif %}
  </div>
</div>

<div class="ge-bottom-sheet ge-legal-sheet" id="ge-sheet-cgu" role="dialog" aria-modal="true" aria-labelledby="ge-sheet-cgu-title" hidden data-ge-expand>
  <div class="ge-sheet-handle" aria-hidden="true"></div>
  <header class="ge-sheet-head">
    <div>
      <p class="ge-auth-kicker">Juridique</p>
      <h2 id="ge-sheet-cgu-title">CGU</h2>
    </div>
    <button type="button" class="ge-sheet-x" data-sheet-close aria-label="Fermer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="ge-sheet-scroll">
    {% include "partials/terms_body.html" %}
  </div>
</div>
