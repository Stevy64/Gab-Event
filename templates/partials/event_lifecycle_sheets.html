<div class="ge-bottom-sheet" id="ge-sheet-event-life-confirm" role="dialog" aria-modal="true" aria-labelledby="ge-sheet-event-life-confirm-title" hidden>
  <div class="ge-sheet-handle" aria-hidden="true"></div>
  <header class="ge-sheet-head">
    <h2 id="ge-sheet-event-life-confirm-title" data-life-confirm-title>Confirmer</h2>
    <button type="button" class="ge-sheet-x" data-sheet-close aria-label="Fermer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <p class="ge-sheet-lead" data-life-confirm-lead></p>
  <div class="ge-sheet-actions">
    <button type="button" class="ge-btn-ghost" data-sheet-close>Annuler</button>
    <form method="post" data-life-form>
      {% csrf_token %}
      <input type="hidden" name="action" value="" data-life-action-input>
      <input type="hidden" name="next" value="{% url 'my_events' %}">
      <button type="submit" class="ok-btn-dark" data-life-confirm-submit>Confirmer</button>
    </form>
  </div>
</div>
