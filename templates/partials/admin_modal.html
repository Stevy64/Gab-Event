<div id="zyz-detail-modal" class="zyz-modal" hidden aria-hidden="true">
  <div class="zyz-modal-backdrop" data-zyz-close></div>
  <div class="zyz-modal-card" role="dialog" aria-modal="true" aria-labelledby="zyz-modal-title">
    <div class="zyz-modal-grab" aria-hidden="true"></div>
    <div class="zyz-modal-head">
      <div class="zyz-modal-avatar" id="zyz-modal-avatar">?</div>
      <div class="zyz-modal-titles">
        <p class="zyz-modal-kicker" id="zyz-modal-kicker">Invitation</p>
        <h2 id="zyz-modal-title">—</h2>
      </div>
      <button type="button" class="zyz-modal-x" data-zyz-close aria-label="Fermer">×</button>
    </div>
    <ul class="zyz-modal-fields" id="zyz-modal-fields"></ul>
    <div class="zyz-modal-actions">
      <button type="button" class="zyz-btn zyz-btn-ghost" data-zyz-close>Fermer</button>
      <a class="zyz-btn zyz-btn-dark" id="zyz-modal-edit" href="#">Ouvrir</a>
    </div>
  </div>
</div>
<div id="cx-confirm-modal" class="zyz-modal" hidden aria-hidden="true">
  <div class="zyz-modal-backdrop" data-cx-confirm-cancel></div>
  <div class="zyz-modal-card cx-confirm-card" role="dialog" aria-modal="true" aria-labelledby="cx-confirm-title">
    <div class="zyz-modal-grab" aria-hidden="true"></div>
    <div class="zyz-modal-head">
      <div class="zyz-modal-avatar" id="cx-confirm-avatar" aria-hidden="true">!</div>
      <div class="zyz-modal-titles">
        <p class="zyz-modal-kicker" id="cx-confirm-kicker">Confirmation</p>
        <h2 id="cx-confirm-title">Confirmer</h2>
      </div>
    </div>
    <p class="cx-confirm-text" id="cx-confirm-text"></p>
    <div class="zyz-modal-actions">
      <button type="button" class="zyz-btn zyz-btn-ghost" data-cx-confirm-cancel>Annuler</button>
      <button type="button" class="zyz-btn zyz-btn-dark" id="cx-confirm-ok">Confirmer</button>
    </div>
  </div>
</div>
