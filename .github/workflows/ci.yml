name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DJANGO_SETTINGS_MODULE: config.settings
  SECRET_KEY: ci-github-actions-secret-not-for-production
  DEBUG: "1"
  ALLOW_MOCK_PAYMENTS: "1"
  PAYMENT_PROVIDER: mock
  PUBLIC_BASE_URL: http://127.0.0.1:8000

jobs:
  sqlite:
    name: Tests SQLite + contrôles prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Contrôles Django
        run: |
          python manage.py check --settings=config.test_settings
          python manage.py makemigrations --check --dry-run --settings=config.test_settings

      - name: Contrôle déploiement
        env:
          DEBUG: "0"
          SECRET_KEY: ci-deploy-check-secret-32-chars-minimum
          ALLOWED_HOSTS: gabevent.example
          CSRF_TRUSTED_ORIGINS: https://gabevent.example
          PUBLIC_BASE_URL: https://gabevent.example
          SECURE_SSL: "1"
          BEHIND_PROXY: "1"
        run: python manage.py check --deploy

      - name: Tests de non-régression et d’intégration
        run: python manage.py test --settings=config.test_settings --verbosity=1

      - name: Collecte des fichiers statiques
        env:
          DEBUG: "0"
          SECRET_KEY: ci-deploy-check-secret-32-chars-minimum
        run: python manage.py collectstatic --noinput --verbosity=0

  postgres:
    name: Tests Postgres (cible OVH)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gabevent
          POSTGRES_USER: gabevent
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gabevent -d gabevent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: gabevent
      POSTGRES_USER: gabevent
      POSTGRES_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Tests d’intégration Postgres
        run: python manage.py test --verbosity=1

  deploy-pythonanywhere:
    name: Déployer sur PythonAnywhere
    needs: [sqlite, postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Lire les secrets
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_USER: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_SSH: ${{ secrets.PYTHONANYWHERE_SSH_KEY }}
        run: |
          echo "PA_USER_SET=${PA_USER:+1}" >> "$GITHUB_ENV"
          echo "PA_SSH_SET=${PA_SSH:+1}" >> "$GITHUB_ENV"
          echo "PA_TOKEN_SET=${PA_TOKEN:+1}" >> "$GITHUB_ENV"
          if [ -z "$PA_USER" ]; then
            echo "Déploiement ignoré : ajoutez les secrets PYTHONANYWHERE_* dans GitHub."
          fi

      - name: Déployer par SSH
        if: env.PA_USER_SET == '1' && env.PA_SSH_SET == '1'
        uses: appleboy/ssh-action@v1.2.2
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PYTHONANYWHERE_HOST: www.pythonanywhere.com
          PYTHONANYWHERE_DOMAIN: ${{ secrets.PYTHONANYWHERE_DOMAIN }}
        with:
          host: ssh.pythonanywhere.com
          username: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          key: ${{ secrets.PYTHONANYWHERE_SSH_KEY }}
          envs: PYTHONANYWHERE_API_TOKEN,PYTHONANYWHERE_USERNAME,PYTHONANYWHERE_HOST,PYTHONANYWHERE_DOMAIN
          script: |
            export PA_PROJECT_DIR="${HOME}/Gab-Event"
            bash "${HOME}/Gab-Event/deploy/pythonanywhere.sh"

      - name: Recharger l’appli (API)
        if: env.PA_USER_SET == '1' && env.PA_TOKEN_SET == '1' && env.PA_SSH_SET != '1'
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PA_USER: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_DOMAIN: ${{ secrets.PYTHONANYWHERE_DOMAIN }}
        run: |
          DOMAIN="${PA_DOMAIN:-${PA_USER}.pythonanywhere.com}"
          curl -fsS -X POST \
            -H "Authorization: Token ${PA_TOKEN}" \
            "https://www.pythonanywhere.com/api/v0/user/${PA_USER}/webapps/${DOMAIN}/reload/"
          echo "Web app rechargée : https://${DOMAIN}/"
          echo "Sans clé SSH, le git pull doit être fait sur PythonAnywhere (tâche planifiée ou pull manuel)."
