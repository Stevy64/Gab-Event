apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: gabevent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: gabevent
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
