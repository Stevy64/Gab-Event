apiVersion: v1
kind: ConfigMap
metadata:
  name: gabevent-nginx
  namespace: gabevent
data:
  default.conf: |
    server {
      listen 8080;
      client_max_body_size 20m;
      location /media/ {
        alias /media/;
      }
      location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_read_timeout 120s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gabevent-web
  namespace: gabevent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gabevent-web
  template:
    metadata:
      labels:
        app: gabevent-web
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: gunicorn
          image: ghcr.io/stevy64/gabevent:main
          imagePullPolicy: Always
          workingDir: /app
          command: ["gunicorn", "config.wsgi:application", "--bind", "127.0.0.1:8000", "--workers", "1", "--timeout", "120"]
          envFrom:
            - secretRef:
                name: gabevent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: media
              mountPath: /app/media
        - name: nginx
          image: docker.io/nginxinc/nginx-unprivileged:1.27
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/
              port: 8080
              httpHeaders:
                - name: Host
                  value: localhost
                - name: X-Forwarded-Proto
                  value: https
          livenessProbe:
            httpGet:
              path: /health/
              port: 8080
              httpHeaders:
                - name: Host
                  value: localhost
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 40
          volumeMounts:
            - name: media
              mountPath: /media
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: gabevent-media
        - name: nginx-conf
          configMap:
            name: gabevent-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: gabevent-web
  namespace: gabevent
spec:
  selector:
    app: gabevent-web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gabevent
  namespace: gabevent
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - gabevent.gabomazone.com
      secretName: gabevent-tls
  rules:
    - host: gabevent.gabomazone.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gabevent-web
                port:
                  number: 80
