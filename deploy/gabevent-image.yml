# Exemple. GitHub ne le lance pas ici.
# Pour qu'il parte à chaque push sur main : le copier vers
# .github/workflows/gabevent-image.yml
# Aucun secret n'est écrit dans ce fichier. GITHUB_TOKEN est fourni par le job.

name: image

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "validation/**"
      - "templates/**"
      - "static/**"
      - "deploy/**"
      - "requirements.txt"
      - "manage.py"
      - ".github/workflows/gabevent-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: gabevent-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nom de l'image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gabevent" >> "$GITHUB_ENV"

      - name: Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.gabevent
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
